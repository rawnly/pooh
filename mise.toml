[tools]
mr-boxington = { version = "latest", workflow = "release.yml@refs/heads/main" }
rust = "latest"

[tasks.build]
run = "cargo build --release"

[tasks.check]
run = "cargo fmt --all --check && cargo clippy --all-targets -- -D warnings && cargo test"

[tasks.install]
run = "cargo install --path ."
