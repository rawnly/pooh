[package]
name = "pooh"
version = "0.1.0"
edition = "2024"
description = "Project manager with git worktree and zoxide support, built for humans and agents"
license = "MIT"
repository = "https://github.com/rawnly/pooh"

[[bin]]
name = "pooh"
path = "src/bin/pooh.rs"

# Short name, same program.
[[bin]]
name = "po"
path = "src/bin/po.rs"

[dependencies]
# use-dev-tty: read input from /dev/tty even when stdin is not a terminal. Without it
# crossterm busy-loops on macOS (kqueue cannot poll the tty device).
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
eyre = "0.6.14"
ratatui = "0.30.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usage = { package = "usage-rs", version = "6", features = ["completions"] }

[dev-dependencies]
tempfile = "3"
